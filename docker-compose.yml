services:
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    environment:
      APP_NAME: ${APP_NAME:-KeelBill Ledger API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:Kbprakash%4078935@db:5432/quotation_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gibbs_P}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FRONTEND_URL: ${DOCKER_FRONTEND_URL:-https://keelbill.in}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-https://keelbill.in,https://www.keelbill.in}

      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kbprakash@78935}
      POSTGRES_DB: ${POSTGRES_DB:-quotation_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
