services:
  # -----------------------------------------
  # Init container: Fetch DB secret from AWS
  # -----------------------------------------

  db-init:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    user: root
    environment:
      AWS_REGION: ap-south-2
      AWS_SECRET_ID: prod/db
    entrypoint:
      - python
      - /app/app/scripts/fetch_db_secrets.py
    volumes:
      - shared_secrets:/shared/secrets

  # -----------------------------------------
  # Backend: Python API
  # -----------------------------------------

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-KeelBill Ledger API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}

      AWS_REGION: ap-south-2
      AWS_SECRET_ID: prod/db

      DATABASE_URL: ${DATABASE_URL_DOCKER}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

      FRONTEND_URL: ${DOCKER_FRONTEND_URL:-https://keelbill.in}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-https://keelbill.in,https://www.keelbill.in}

      PORT: "8000"

    volumes:
      - shared_secrets:/shared/secrets:ro

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  # -----------------------------------------
  # Frontend
  # -----------------------------------------

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # -----------------------------------------
  # PostgreSQL database
  # -----------------------------------------

  db:
    image: postgres:16

    depends_on:
      db-init:
        condition: service_completed_successfully

    environment:
      POSTGRES_PASSWORD_FILE: /shared/secrets/password.txt
      POSTGRES_USER: postgres
      POSTGRES_DB: quotation_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - shared_secrets:/shared/secrets:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
  shared_secrets:
