version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: quotation_generator_backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    container_name: quotation_generator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kbprakash@78935
      POSTGRES_DB: quotation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
